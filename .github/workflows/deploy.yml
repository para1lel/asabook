name: Deploy ASa Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asabook-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Pull, build and publish on the server
        env:
          ASABOOK_DEPLOY_URL: https://deploy.asabook.cc
          ASABOOK_DEPLOY_TOKEN: ${{ secrets.ASABOOK_DEPLOY_TOKEN }}
        run: node scripts/deploy/trigger.mjs
