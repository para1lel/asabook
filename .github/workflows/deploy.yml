name: Deploy ASa Book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: asabook-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (Node 24)
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false
      - name: Pull, build and publish on the server
        env:
          ASABOOK_DEPLOY_URL: https://deploy.asabook.cc
          ASABOOK_DEPLOY_TOKEN: ${{ secrets.ASABOOK_DEPLOY_TOKEN }}
        run: node scripts/deploy/trigger.mjs
